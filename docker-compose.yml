version: "3.9"

services:

  db:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vkr
      POSTGRES_PASSWORD: vkrpass
      POSTGRES_DB: vkrdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/sql:/docker-entrypoint-initdb.d:ro

  ai:
    build: ./ai_module
    container_name: ai_module
    ports:
      - "5000:5000"
    volumes:
      - ./ai_module/model:/app/model:ro
    environment:
      ENABLE_REMOTE_MODEL_DOWNLOAD: "0"
      REQUIRE_LOCAL_EMBEDDING_MODEL: "1"
      SENTENCE_MODEL_PATH: "/app/model"
      SENTENCE_MODEL_NAME: "sentence-transformers/all-MiniLM-L6-v2"
      EMBEDDING_MODEL_WAIT_SECONDS: "90"
      FALLBACK_VECTOR_DIM: "128"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)); assert data.get('embedding_enabled') and data.get('model_name') == 'sentence-transformers/all-MiniLM-L6-v2', data"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend
    expose:
      - "8000"
    depends_on:
      ai:
        condition: service_healthy
      db:
        condition: service_started
    restart: unless-stopped
    environment:
      AI_URL: "http://ai:5000"
      DATABASE_URL: "postgresql+psycopg2://vkr:vkrpass@db/vkrdb"
      APP_TIMEZONE: "Asia/Novosibirsk"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend_new3/frontend/app
    container_name: frontend
    expose:
      - "80"
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
