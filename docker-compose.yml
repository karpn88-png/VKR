version: "3.9"

services:

  db:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vkr
      POSTGRES_PASSWORD: vkrpass
      POSTGRES_DB: vkrdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/sql:/docker-entrypoint-initdb.d:ro

  ai:
    build: ./ai_module
    container_name: ai_module
    ports:
      - "5000:5000"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend
    expose:
      - "8000"
    depends_on:
      - ai
      - db
    restart: unless-stopped
    environment:
      AI_URL: "http://ai:5000"
      DATABASE_URL: "postgresql+psycopg2://vkr:vkrpass@db/vkrdb"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend_new2/frontend/app
    container_name: frontend
    expose:
      - "3000"
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
