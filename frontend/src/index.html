<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Анализ документа</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; }
    textarea { width: 100%; height: 150px; }
    pre { background: #f3f3f3; padding: 10px; white-space: pre-wrap; }
    .block { margin-bottom: 20px; }
    .doc-item { padding: 8px; background: #eef; margin-bottom: 6px; border-radius: 6px; }
    button { margin-top: 8px; }
  </style>
</head>
<body>

  <h1>AI-анализ документов</h1>

  <div class="block">
    <h3>Загрузить файл</h3>
    <input type="file" id="fileInput" />
    <button type="button" onclick="uploadFile()">Загрузить</button>
    <p id="uploadStatus"></p>
  </div>

  <hr>

  <div class="block">
    <h3>Список загруженных документов</h3>
    <button type="button" onclick="loadDocuments()">Показать документы</button>
    <div id="docsList"></div>
  </div>

  <hr>

  <div class="block">
    <h3>Анализ документа</h3>
    <input type="number" id="docIdInput" placeholder="ID документа" />
    <button type="button" onclick="analyzeDocument()">Анализировать</button>

    <h4>Результат анализа (метрики)</h4>
    <pre id="analysisResult"></pre>

    <h4>Отчёт LLM</h4>
    <pre id="llmReport"></pre>

    <button type="button" onclick="downloadWordReport()">Скачать отчёт в Word</button>
    <p id="downloadStatus"></p>
  </div>

  <script>
    // Если nginx проксирует backend как /api — оставь так.
    // Если ходишь напрямую на порт 8000, замени на:
    // const API_BASE = `${window.location.protocol}//${window.location.hostname}:8000`;
    const API_BASE = `${window.location.protocol}//${window.location.hostname}/api`;

    async function uploadFile() {
      const file = document.getElementById("fileInput").files[0];
      if (!file) {
        alert("Выберите файл");
        return;
      }

      document.getElementById("uploadStatus").innerText = "Загрузка...";

      const formData = new FormData();
      formData.append("file", file);

      const res = await fetch(`${API_BASE}/upload`, {
        method: "POST",
        body: formData
      });

      if (!res.ok) {
        const text = await res.text();
        document.getElementById("uploadStatus").innerText =
          `Ошибка загрузки (HTTP ${res.status}): ${text.slice(0, 200)}`;
        return;
      }

      const data = await res.json();

      if (data.id) {
        document.getElementById("uploadStatus").innerText =
          "Файл загружен! ID: " + data.id;
        document.getElementById("docIdInput").value = data.id;
        loadDocuments().catch(() => {});
      } else {
        document.getElementById("uploadStatus").innerText =
          "Ошибка: " + JSON.stringify(data);
      }
    }

    async function loadDocuments() {
      const container = document.getElementById("docsList");
      container.innerText = "Загрузка списка...";

      const res = await fetch(`${API_BASE}/documents`);

      if (!res.ok) {
        const text = await res.text();
        container.innerText =
          `Ошибка загрузки списка (HTTP ${res.status}): ${text.slice(0, 200)}`;
        return;
      }

      const docs = await res.json();

      container.innerHTML = "";

      docs.forEach(doc => {
        const div = document.createElement("div");
        div.className = "doc-item";

        div.innerHTML = `
          <b>ID:</b> ${doc.id}<br>
          <b>Имя:</b> ${doc.filename}<br>
          <b>Размер:</b> ${Math.round(doc.size / 1024)} KB<br>
          <b>Дата:</b> ${new Date(doc.uploaded_at).toLocaleString()}<br>
          <button type="button" onclick="setDocId(${doc.id})">Выбрать</button>
        `;

        container.appendChild(div);
      });

      if (docs.length === 0) {
        container.innerText = "Документов пока нет.";
      }
    }

    function setDocId(id) {
      document.getElementById("docIdInput").value = id;
    }

    async function analyzeDocument() {
      const id = document.getElementById("docIdInput").value;
      if (!id) {
        alert("Введите ID документа");
        return;
      }

      // Очистим/покажем статус
      const analysisEl = document.getElementById("analysisResult");
      const llmEl = document.getElementById("llmReport");

      analysisEl.innerText = "Анализируем...";
      llmEl.innerText = "Генерируем отчёт LLM...";

      const res = await fetch(`${API_BASE}/analyze_document/${id}`, {
        method: "POST"
      });

      if (!res.ok) {
        const text = await res.text();
        analysisEl.innerText = `Ошибка анализа (HTTP ${res.status}): ${text.slice(0, 500)}`;
        llmEl.innerText = "";
        return;
      }

      const data = await res.json();

      // 1) Метрики (только 4 поля)
      const a = data.analysis || {};
      analysisEl.innerText =
        `total_words: ${a.total_words ?? "-"}\n` +
        `unique_words: ${a.unique_words ?? "-"}\n` +
        `uniqueness: ${a.uniqueness ?? "-"}\n` +
        `embedding_dim: ${a.embedding_dim ?? "-"}`;

      // 2) Отчёт LLM (текст)
      llmEl.innerText = data.llm_report || data.llmReport || "Отчёт LLM отсутствует.";
    }

    function downloadWordReport() {
      const id = document.getElementById("docIdInput").value;
      if (!id) {
        alert("Введите ID документа");
        return;
      }

      const statusEl = document.getElementById("downloadStatus");
      if (statusEl) statusEl.innerText = "";

      // Скачивание DOCX через открытие ссылки
      window.location.href = `${API_BASE}/report_word/${id}`;
    }

    // Автозагрузка списка при открытии страницы
    window.addEventListener("load", () => {
      loadDocuments().catch(() => {});
    });
  </script>

</body>
</html>
